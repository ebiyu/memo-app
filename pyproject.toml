[project]
name = "memo"
version = "0.1.0"
description = "Plain-text sticky notes that edit local files"
requires-python = ">=3.12"
dependencies = [
    "merge3>=0.0.15",
]

[project.gui-scripts]
memo-desktop = "memo.desktop.__main__:main"

[dependency-groups]
desktop = [
    "wxpython>=4.2.2",
]
dev = [
    "pytest>=8",
]

[tool.uv]
default-groups = ["desktop", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
