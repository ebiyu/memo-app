[project]
name = "memo"
version = "0.1.0"
description = "Plain-text sticky notes with cloud sync and MCP"
requires-python = ">=3.12"
dependencies = [
    "merge3>=0.0.15",
]

[project.scripts]
memo-server = "memo.server.__main__:main"

[project.gui-scripts]
memo-desktop = "memo.desktop.__main__:main"

# uv run で全部入るよう依存グループで管理する。
# サーバーだけ入れる場合 (Docker など): uv sync --no-default-groups --group server
[dependency-groups]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=2.0",
]
desktop = [
    "wxpython>=4.2.2",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["server", "desktop", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
